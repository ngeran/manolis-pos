services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: manolis
      POSTGRES_PASSWORD: manolis123
      POSTGRES_DB: manolis_pos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://manolis:manolis123@db:5432/manolis_pos
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-change-in-production
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pgdata:
